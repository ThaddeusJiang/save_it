# Manually create and publish a GitHub pre-release from the selected branch and tag.
name: Release (manual)
run-name: Release manual ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Prerelease tag to create (for example: v0.5.0-rc.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-manual-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: release (${{ inputs.tag }})
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Checkout (${{ inputs.tag }})
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Prepare release metadata (${{ inputs.tag }})
        id: prepare
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$INPUT_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]; then
            echo "Prerelease tag must use vMAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi

          heading_prefix="## [$INPUT_TAG] - "
          heading="$(grep -F -m 1 "$heading_prefix" CHANGELOG.md || true)"
          release_date="${heading#"$heading_prefix"}"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "CHANGELOG.md must contain a dated heading for $INPUT_TAG"
            exit 1
          fi

          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub CLI
        run: gh --version

      - name: Create published GitHub pre-release (${{ inputs.tag }})
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_DATE: ${{ steps.prepare.outputs.release_date }}
        run: |
          gh release create "$INPUT_TAG" \
            --target "$RELEASE_BRANCH" \
            --title "save_it $INPUT_TAG - $RELEASE_DATE" \
            --generate-notes \
            --prerelease

  docker:
    name: docker (${{ needs.release.outputs.version }})
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      is_prerelease: true
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
